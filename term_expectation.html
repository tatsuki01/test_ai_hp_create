            <h2 class="section-title">期待値</h2>
            <p>期待値は、確率変数が取り得る値とその確率の重み付き平均として定義されます。離散型の場合、各値 \(x_i\) とその確率 \(p_i\) の積を足し合わせることで求められます。</p>
            <div class="note">
                <h4>期待値の定義</h4>
                <p class="math">E[X] = \sum_i x_i p_i</p>
                <p>ここで <em>x<sub>i</sub></em> は確率変数の取り得る値、<em>p<sub>i</sub></em> はその確率を表します。</p>
            </div>
            <p>期待値はデータの「中心」を表す指標であり、確率論の基本概念としてさまざまな統計手法で利用されます。</p>
            <p>詳しくは <a href="probability.html">確率論の基礎</a> のページを参照してください。</p>
        </article>
