            <h2 class="section-title">分散</h2>
            <p>分散は、確率変数がその平均からどれだけ離れているか（ばらつき）を表す指標です。期待値だけではデータの散らばり具合を表せないため、分散が用いられます。</p>
            <div class="note">
                <h4>分散の定義</h4>
                <p class="math">Var(X) = E[(X - \mu)^2]</p>
                <p>ここで \(\mu = E[X]\) は期待値です。分散は平均からの偏差の 2 乗の期待値として定義されます。</p>
            </div>
            <p>分散の平方根を<strong>標準偏差</strong>と呼び、データの散らばりを元の単位で表すのに便利です。</p>
            <p>詳しくは <a href="probability.html">確率論の基礎</a> のページを参照してください。</p>
        </article>
